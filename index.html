<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Makanaky</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            /* Fondo transparente para que no tape tu Live */
            background-color: transparent;
            color: white;
        }

        .menu-container {
            background-color: rgba(15, 15, 15, 0.85);
            border: 3px solid #ffcc00;
            border-radius: 15px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 0 15px #ffcc00;
        }

        .titulo {
            text-align: center;
            color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #222;
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 5px solid #e91e63;
        }

        .regalo {
            font-weight: bold;
            color: #e91e63;
            font-size: 18px;
        }

        .accion {
            font-size: 16px;
        }

        .meta {
            text-align: center;
            background-color: #4CAF50;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="menu-container">
        <div class="titulo">Brosteria La Realeza</div>

        <div class="item">
            <span class="regalo">1 Rosa</span>
            <span class="accion">Saludo de barrio</span>
        </div>

        <div class="item">
            <span class="regalo">1 Dona</span>
            <span class="accion">Grito Gaaaa!</span>
        </div>

        <div class="item">
            <span class="regalo">1 Helado</span>
            <span class="accion">Insulto elegante</span>
        </div>

        <div class="meta">
            Meta de Likes: 0 / 10,000
        </div>
    </div>

    <!-- El Botón -->
    <button id="btn-makanaky" onclick="toggleMakanaky()"
        style="padding: 15px; background-color: green; color: white; font-weight: bold; border-radius: 8px; cursor: pointer;">
        🟢 PRENDER MAKANAKY
    </button>

    <!-- La Lógica JavaScript -->
    <script>
        function toggleMakanaky() {
            // Enviamos una petición POST al servidor local de Python
            fetch('http://localhost:5000/toggle', {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    const btn = document.getElementById('btn-makanaky');
                    // Cambiamos el color y texto del botón según la respuesta de Python
                    if (data.bot_activo) {
                        btn.innerText = "🔴 APAGAR MAKANAKY";
                        btn.style.backgroundColor = "red";
                    } else {
                        btn.innerText = "🟢 PRENDER MAKANAKY";
                        btn.style.backgroundColor = "green";
                    }
                })
                .catch(error => {
                    console.error("No se pudo conectar con el cerebro de Makanaky:", error);
                    alert("Asegúrate de que el script de Python esté corriendo, causa.");
                });
        }
    </script>

</body>

</html>
